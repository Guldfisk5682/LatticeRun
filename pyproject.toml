[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latticerun"
version = "0.1.0"
description = "Low-bit quantization, capability recovery, and efficient LLM deployment"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
  "safetensors>=0.5",
  "torch>=2.5",
  "transformers>=5.8,<6",
]

[project.optional-dependencies]
train = [
  "accelerate>=1.10,<2",
  "tensorboard>=2.20",
]
test = [
  "peft>=0.20",
  "pytest>=8.3",
  "ruff>=0.12",
]

[project.scripts]
latticerun = "latticerun.cli:main"

[tool.setuptools]
packages = [
  "latticerun",
  "latticerun.model",
  "latticerun.quant",
  "latticerun.adapters",
  "latticerun.opd",
]

[tool.setuptools.package-dir]
latticerun = "src"
"latticerun.model" = "src/model"
"latticerun.quant" = "src/quant"
"latticerun.adapters" = "src/adapters"
"latticerun.opd" = "src/opd"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
